Title: GLACIER Molecular Embeddings
Description: Encodes a molecule into 512 features by passing it through three encoders
  at once, a message-passing network over the graph, a transformer over the SMILES
  string and a multilayer perceptron over physicochemical descriptors, then fusing
  the three with a Finsler geometry-aware module. Nguyen and colleagues pretrained
  the encoders on 100,000 molecules sampled from Enamine REAL and distilled the MiniMol
  and MolFormer teachers into them by contrastive learning, so a compact model keeps
  pace with far heavier ones. Dimensions carry no individual chemical meaning.
